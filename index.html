<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>HITSTER Countdown</title>

<style>
  *{box-sizing:border-box}

  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden
  }

  main{
    width:100%;
    padding:28px
  }

  #rotate{
    font-size:clamp(2rem,8vw,5rem);
    font-weight:800;
    line-height:1.05
  }

  #sub{
    font-size:clamp(1rem,4vw,1.5rem);
    margin-top:18px;
    opacity:.8
  }

  #count{
    font-size:min(45vw,20rem);
    font-weight:900;
    line-height:1;
    margin:10px 0
  }

  #faceDownMessage{
    font-size:clamp(2rem,8vw,5rem);
    font-weight:900;
    line-height:1.05
  }

  #faceDownSub{
    font-size:clamp(1rem,4vw,1.5rem);
    margin-top:18px;
    opacity:.8
  }

  button{
    border:0;
    border-radius:999px;
    padding:18px 34px;
    font-size:1.25rem;
    font-weight:800;
    cursor:pointer
  }

  #start{
    background:#fff;
    color:#000
  }

  #again{
    display:none;
    background:#333;
    color:#fff;
    margin-top:14px
  }

  .hidden{
    display:none!important
  }

  @media (orientation:landscape){
    #rotate{
      font-size:clamp(1.5rem,5vw,3rem)
    }

    #sub{
      margin-top:10px
    }
  }
</style>
</head>

<body>

<main>

  <div id="rotate">↻ TURN YOUR PHONE</div>
  <div id="sub">Landscape mode recommended</div>

  <div id="ready" style="margin-top:30px">
    <button id="start">START COUNTDOWN</button>
  </div>

  <div id="timer" class="hidden">
    <div id="count">10</div>
    <div id="timerSub">Get ready…</div>
  </div>

  <div id="done" class="hidden">

    <div id="faceDownMessage">
      TIME!
    </div>

    <div id="faceDownSub">
      Opening Spotify…
    </div>

    <button id="again">↻ AGAIN</button>

  </div>

</main>

<script>

const params = new URLSearchParams(location.search);

const spotify = params.get("spotify") || "";

const seconds = Math.max(
  1,
  Math.min(
    60,
    Number(params.get("seconds")) || 10
  )
);

const start = document.getElementById("start");
const ready = document.getElementById("ready");
const timer = document.getElementById("timer");
const count = document.getElementById("count");
const done = document.getElementById("done");
const again = document.getElementById("again");

const faceDownMessage =
  document.getElementById("faceDownMessage");

const faceDownSub =
  document.getElementById("faceDownSub");


let running = false;
let finished = false;
let timerInterval = null;


/*
 * ---------------------------------------------------------
 * SENSOR PERMISSION
 * ---------------------------------------------------------
 *
 * iPhone/iPad require permission for motion sensors.
 * Android normally does not.
 */
async function requestSensorPermission() {

  try {

    if (
      typeof DeviceMotionEvent !== "undefined" &&
      typeof DeviceMotionEvent.requestPermission === "function"
    ) {

      const permission =
        await DeviceMotionEvent.requestPermission();

      if (permission !== "granted") {
        console.log("Motion permission not granted.");
      }

    }

    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {

      const permission =
        await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") {
        console.log("Orientation permission not granted.");
      }

    }

  } catch (error) {

    console.log(
      "Sensor permission request failed:",
      error
    );

  }

}


/*
 * ---------------------------------------------------------
 * FACE-DOWN DETECTION
 * ---------------------------------------------------------
 *
 * beta close to ±180° generally means the back of the
 * phone is facing upward / screen is facing downward.
 */
function isFaceDown(event) {

  if (typeof event.beta !== "number") {
    return false;
  }

  const beta = Math.abs(event.beta);

  return beta > 150;
}


/*
 * ---------------------------------------------------------
 * PHONE FLIPPED
 * ---------------------------------------------------------
 */
function handleOrientation(event) {

  /*
   * If something has already triggered Spotify,
   * ignore further sensor events.
   */
  if (!running || finished) {
    return;
  }

  if (!isFaceDown(event)) {
    return;
  }

  /*
   * Phone was flipped before the countdown ended.
   */
  openSpotify("flip");

}


/*
 * ---------------------------------------------------------
 * OPEN SPOTIFY
 * ---------------------------------------------------------
 *
 * This function can be triggered by:
 *
 *   1. Countdown reaching zero
 *   2. Phone being flipped face-down
 *
 * Whichever happens first wins.
 */
function openSpotify(reason) {

  if (finished) {
    return;
  }

  finished = true;
  running = false;


  /*
   * Stop countdown.
   */
  if (timerInterval) {

    clearInterval(timerInterval);
    timerInterval = null;

  }


  /*
   * Stop listening for orientation changes.
   */
  window.removeEventListener(
    "deviceorientation",
    handleOrientation,
    true
  );


  /*
   * Update screen.
   */
  timer.classList.add("hidden");
  done.classList.remove("hidden");

  faceDownMessage.textContent =
    reason === "flip" ? "FLIPPED!" : "TIME!";

  faceDownSub.textContent =
    "Opening Spotify…";


  /*
   * Small vibration.
   */
  if (navigator.vibrate) {

    navigator.vibrate([
      120,
      80,
      120
    ]);

  }


  /*
   * No Spotify URL.
   */
  if (!spotify) {

    faceDownSub.textContent =
      "No Spotify track was supplied.";

    again.style.display = "inline-block";

    return;
  }


  /*
   * Open Spotify in a NEW TAB.
   */
  const newTab =
    window.open(
      spotify,
      "_blank",
      "noopener,noreferrer"
    );


  /*
   * Try to close this countdown tab.
   *
   * Browsers may refuse this if the current tab was
   * opened directly by scanning a QR code.
   */
  setTimeout(() => {

    try {

      window.close();

    } catch (error) {

      console.log(
        "Browser prevented closing the current tab."
      );

    }

  }, 150);


  /*
   * If popup blocking prevented the new tab,
   * provide a fallback by navigating the current tab.
   */
  if (!newTab) {

    faceDownSub.textContent =
      "Opening Spotify…";

    setTimeout(() => {

      window.location.href = spotify;

    }, 100);

  }

}


/*
 * ---------------------------------------------------------
 * START COUNTDOWN
 * ---------------------------------------------------------
 */
async function run() {

  if (running) {
    return;
  }

  running = true;
  finished = false;

  ready.classList.add("hidden");
  done.classList.add("hidden");
  timer.classList.remove("hidden");

  again.style.display = "none";


  /*
   * Request sensor permissions while we still have
   * a user gesture.
   */
  await requestSensorPermission();


  /*
   * Listen for the phone being flipped.
   */
  window.addEventListener(
    "deviceorientation",
    handleOrientation,
    true
  );


  let n = seconds;

  count.textContent = n;


  timerInterval = setInterval(() => {

    /*
     * The phone may have been flipped between timer ticks.
     */
    if (finished) {
      return;
    }

    n--;

    if (n <= 0) {

      /*
       * Timer wins.
       */
      openSpotify("timer");

    } else {

      count.textContent = n;

    }

  }, 1000);

}


/*
 * ---------------------------------------------------------
 * MANUAL START
 * ---------------------------------------------------------
 */
start.addEventListener("click", run);


/*
 * ---------------------------------------------------------
 * AGAIN
 * ---------------------------------------------------------
 */
again.addEventListener("click", () => {

  window.removeEventListener(
    "deviceorientation",
    handleOrientation,
    true
  );

  if (timerInterval) {

    clearInterval(timerInterval);
    timerInterval = null;

  }

  running = false;
  finished = false;

  done.classList.add("hidden");
  ready.classList.remove("hidden");

  faceDownMessage.textContent = "TIME!";
  faceDownSub.textContent = "Opening Spotify…";

});


/*
 * ---------------------------------------------------------
 * AUTOMATIC START
 * ---------------------------------------------------------
 *
 * Countdown still starts automatically, as in the
 * original version.
 *
 * IMPORTANT:
 * On iOS, motion permission may require the user to
 * press START COUNTDOWN.
 * ---------------------------------------------------------
 */
window.addEventListener("load", () => {

  setTimeout(() => {

    run();

  }, 100);

});

</script>

</body>
</html>
